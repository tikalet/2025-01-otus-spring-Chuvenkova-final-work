server:
  port: 8080

spring:
  application:
    name: lis
  datasource:
    url: jdbc:postgresql://localhost:5432/lis_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      platform: postgresql

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: ru.otus.laboratory.model

rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest

custom-security:
  publicKey: classpath:app.pub
  privateKey: classpath:app.key
